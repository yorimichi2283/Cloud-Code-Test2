<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Telop Shifter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="panel">
    <section class="row">
      <button id="loadSelectionBtn" class="primary">タイムラインの選択クリップを読み込む</button>
      <div id="statusLine" class="status">Premiereでテロップ（テキスト/グラフィック）クリップを選択してから、上のボタンを押してください。</div>
    </section>

    <section class="row">
      <div class="clipListLabel">読み込んだクリップ (<span id="clipCount">0</span>件)</div>
      <ul id="clipList" class="clipList"></ul>
    </section>

    <section class="row control">
      <span class="stepGroupLabel">移動幅</span>
      <div class="stepGroup" id="stepSizeGroup">
        <label><input type="radio" name="stepSize" value="1" checked /> 1</label>
        <label><input type="radio" name="stepSize" value="10" /> 10</label>
        <label><input type="radio" name="stepSize" value="50" /> 50</label>
      </div>
    </section>

    <section class="row control">
      <label for="xInput">X座標 (px)</label>
      <div class="stepper">
        <button type="button" class="stepBtn" id="xMinus" disabled>−</button>
        <input type="number" id="xInput" value="0" step="1" disabled />
        <button type="button" class="stepBtn" id="xPlus" disabled>＋</button>
      </div>
    </section>

    <section class="row control">
      <label for="yInput">Y座標 (px)</label>
      <div class="stepper">
        <button type="button" class="stepBtn" id="yMinus" disabled>−</button>
        <input type="number" id="yInput" value="0" step="1" disabled />
        <button type="button" class="stepBtn" id="yPlus" disabled>＋</button>
      </div>
    </section>

    <section class="row control">
      <label for="scaleInput">スケール (%)</label>
      <div class="stepper">
        <button type="button" class="stepBtn" id="scaleMinus" disabled>−</button>
        <input type="number" id="scaleInput" value="0" step="1" disabled />
        <button type="button" class="stepBtn" id="scalePlus" disabled>＋</button>
      </div>
    </section>

    <section class="row buttons">
      <button id="resetBtn" disabled>リセット（元の位置に戻す）</button>
    </section>

    <section class="row">
      <div id="logBox" class="log"></div>
    </section>
  </div>
  <script src="index.js"></script>
</body>
</html>
