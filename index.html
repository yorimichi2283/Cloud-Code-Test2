<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Telop Shifter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="panel">
    <section class="card">
      <h2 class="cardTitle">対象</h2>
      <select id="trackSelect">
        <option value="selection">タイムラインで選択中のクリップ</option>
      </select>
      <label class="checkboxRow">
        <input type="checkbox" id="telopOnly" checked />
        テロップ（グラフィック）だけを対象にする
      </label>
      <button id="loadSelectionBtn" class="primary">読み込む</button>
      <div id="statusLine" class="status">対象を選んでから、上のボタンを押してください。</div>
    </section>

    <section class="card">
      <h2 class="cardTitle">読み込んだクリップ（<span id="clipCount">0</span>件）</h2>
      <ul id="clipList" class="clipList"></ul>
    </section>

    <section class="card">
      <h2 class="cardTitle">調整</h2>

      <div class="field">
        <span class="fieldLabel">X座標</span>
        <button type="button" class="arrowBtn" id="xMinus" disabled>◀</button>
        <input type="number" id="xInput" value="0" step="1" disabled />
        <button type="button" class="arrowBtn" id="xPlus" disabled>▶</button>
        <span class="unit">px</span>
      </div>

      <div class="field">
        <span class="fieldLabel">Y座標</span>
        <button type="button" class="arrowBtn" id="yMinus" disabled>◀</button>
        <input type="number" id="yInput" value="0" step="1" disabled />
        <button type="button" class="arrowBtn" id="yPlus" disabled>▶</button>
        <span class="unit">px</span>
      </div>

      <div class="field">
        <span class="fieldLabel">スケール</span>
        <button type="button" class="arrowBtn" id="scaleMinus" disabled>◀</button>
        <input type="number" id="scaleInput" value="0" step="1" disabled />
        <button type="button" class="arrowBtn" id="scalePlus" disabled>▶</button>
        <span class="unit">%</span>
      </div>

      <div class="hint">
        矢印＝5ずつ / Shift＋クリック＝1ずつ（押しっぱなしで連続移動）
      </div>
    </section>

    <section class="card">
      <h2 class="cardTitle">一括操作</h2>
      <button id="centerHBtn" disabled>横位置を全クリップでそろえる</button>
      <button id="resetBtn" disabled>リセット（読み込んだ時点に戻す）</button>
      <div class="hint">
        使い方：まずX座標の矢印で見た目が中央に来るよう合わせ、そのあとこのボタンを押すと、
        読み込んだ全クリップがその横位置に揃います（ズレている1件だけを多数派に合わせる用途にも使えます）
      </div>
    </section>

    <details class="card logCard">
      <summary class="cardTitle">ログ</summary>
      <button id="inspectBtn" disabled>診断: 1件目のクリップの構造を出力</button>
      <div id="logBox" class="log"></div>
    </details>
  </div>
  <script src="index.js"></script>
</body>
</html>
