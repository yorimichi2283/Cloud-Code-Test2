<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Telop Shifter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="panel">
    <section class="row">
      <label for="trackSelect">対象</label>
      <select id="trackSelect">
        <option value="selection">タイムラインで選択中のクリップ</option>
      </select>
      <label class="checkboxRow">
        <input type="checkbox" id="telopOnly" checked />
        テロップ（グラフィック）だけを対象にする
      </label>
    </section>

    <section class="row">
      <button id="loadSelectionBtn" class="primary">読み込む</button>
      <div id="statusLine" class="status">対象を選んでから、上のボタンを押してください。</div>
    </section>

    <section class="row">
      <div class="clipListLabel">読み込んだクリップ (<span id="clipCount">0</span>件)</div>
      <ul id="clipList" class="clipList"></ul>
    </section>

    <section class="row control">
      <label for="xInput">X座標 (px)</label>
      <div class="arrowRow">
        <button type="button" class="arrowBtn" id="xMinus" disabled>◀</button>
        <input type="number" id="xInput" value="0" step="1" disabled />
        <button type="button" class="arrowBtn" id="xPlus" disabled>▶</button>
      </div>
    </section>

    <section class="row control">
      <label for="yInput">Y座標 (px)</label>
      <div class="arrowRow">
        <button type="button" class="arrowBtn" id="yMinus" disabled>◀</button>
        <input type="number" id="yInput" value="0" step="1" disabled />
        <button type="button" class="arrowBtn" id="yPlus" disabled>▶</button>
      </div>
    </section>

    <section class="row control">
      <label for="scaleInput">スケール (%)</label>
      <div class="arrowRow">
        <button type="button" class="arrowBtn" id="scaleMinus" disabled>◀</button>
        <input type="number" id="scaleInput" value="0" step="1" disabled />
        <button type="button" class="arrowBtn" id="scalePlus" disabled>▶</button>
      </div>
    </section>
    <div class="hint">
      矢印ボタン＝5ずつ / Shift＋クリック＝1ずつ（押しっぱなしで連続移動）。数値欄への直接入力も可。<br />
      元に戻すときは下の「リセット」が確実です（Cmd+Zはタイムラインをクリックしてから）
    </div>

    <section class="row buttons">
      <button id="centerHBtn" disabled>水平方向に中央揃え</button>
      <button id="resetBtn" disabled>リセット（元の位置に戻す）</button>
    </section>

    <section class="row">
      <div id="logBox" class="log"></div>
    </section>
  </div>
  <script src="index.js"></script>
</body>
</html>
